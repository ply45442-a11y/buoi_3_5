<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>
    .item{
        /* height: 50px;
        width: 50px; */
        border: 1px solid black;
        background-color: rgb(11, 100, 57);
        /* margin: 10px; */
        text-align: center;
        font-size: 10px;
        color: azure;

    }
    .container{
        display: grid;
        background-color: rgb(190, 237, 237);
        height: 100px;
        width: 200px;
        /* grid-template-columns:1fr 1fr */

    }
    .item-1{
        grid-column: 1/2;
        grid-row: 1/3;
    }
    .item-2{
        grid-column: 2/3;
        grid-row: 1/2;
    }
    .item-3{
        grid-column: 2/3;
        grid-row: 2/3;
    }
</style>
<body>
    <div class="container">
       <div class ="item-1 item">Item #1</div>
        <div class ="item-2 item">Item #2</div>
        <div class ="item-3 item">Item #3</div>
    </div>
</body>
</html>
